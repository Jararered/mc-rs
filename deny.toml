# cargo-deny configuration. Run with: cargo deny check
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Match the targets this game actually builds for.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are noisy in the Bevy tree; track them but do not fail CI.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
# Broad enough for Bevy and its transitive set; tighten only with a reason.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-0-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# This package is publish = false; do not require a SPDX license on the root.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
