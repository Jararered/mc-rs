[package]
name = "game"
version = "0.1.0"
edition = "2024"

[features]
# Opt in for faster linking while iterating; normal builds favor runtime performance.
dev_dynamic_linking = ["bevy/dynamic_linking"]

# Optimize game code enough for representative local play sessions.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = "0.19.1"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.clippy]
all = "warn"
pedantic = "warn"
# missing_docs_in_private_items = "warn"
