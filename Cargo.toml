[package]
name = "game"
version = "0.1.0"
edition = "2024"

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
