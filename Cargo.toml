[package]
name = "mc-rs"
version = "0.1.0"
edition = "2024"
description = "A Minecraft Beta 1.7.3–inspired voxel game in Rust with Bevy"
repository = "https://github.com/Jararered/mc-rs"
# Nightly-only: rustfmt.toml uses unstable options; rust-toolchain.toml pins the date.
publish = false
default-run = "game"
# One test binary (`tests/main.rs`); every extra target links all of Bevy again.
autotests = false

[features]
# Opt in for faster linking while iterating; normal builds favor runtime performance.
dev_dynamic_linking = ["bevy/dynamic_linking"]
# Builds `examples/chunk_render`, which links all of Bevy again. Off by default
# so `cargo test` does not pay for it.
render_harness = []

# Game code is unoptimized with full debug info, so a debugger shows every
# local and a one-line edit rebuilds in about 2 s. `test` inherits this profile
# unchanged, so `cargo run` and `cargo test` share one set of artifacts.
[profile.dev]
opt-level = 0
debug = true

# Dependencies are optimized, or Bevy is unplayably slow, and keep only line
# tables: full debug info for Bevy makes every link slower and much larger.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# Release favors runtime performance over build time: whole-program LTO in a
# single codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Release without the LTO pass, for judging performance while iterating:
# `cargo run --profile fast`. Dependencies are built once into `target/fast/`
# and an edit recompiles only the game crate. Confirm final numbers on
# `release`, which inlines across crates.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[dependencies]
# Only what the game uses. Bevy's defaults also start gamepads, glTF,
# animation, scenes, sprites, and the post-processing and anti-aliasing
# pipelines, which cost link time and memory for nothing here.
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "sysinfo_plugin",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_render",
    "bevy_core_pipeline",
    # PBR provides mesh batching/drawing and transitively enables bevy_light.
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "ui_picking",
    "png",
    # Sound (`src/audio/`): rodio, and Ogg Vorbis for Beta's `.ogg` files.
    "bevy_audio",
    "vorbis",
] }
# Command line of the dedicated server (`src/bin/server.rs`).
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
num_enum = "0.7.6"
# The tables under `data/`. Bevy already builds it for asset metadata.
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Only to lower the priority of the chunk worker threads (`src/main.rs`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[lints.clippy]
# Groups at a lower priority so per-lint allows below can override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Bevy `SystemParam` queries trip this constantly; leave it off so the rest of
# `clippy::all` stays usable. Systems are wide too, so `too_many_arguments` is
# on with its threshold raised in `clippy.toml` rather than allowed outright.
type_complexity = "allow"

# Tests live under `tests/`, never in `src/`, so skip the empty unit-test and
# doctest harnesses; each one would be another Bevy link. The lib crate stays
# `game` so `use game::…` in tests and examples is unchanged after the package
# rename to `mc-rs`.
[lib]
name = "game"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "game"
path = "src/main.rs"
test = false

# The dedicated server: the same library with no window or renderer started.
[[bin]]
name = "server"
path = "src/bin/server.rs"
test = false

[[test]]
name = "game"
path = "tests/main.rs"

[[example]]
name = "chunk_render"
required-features = ["render_harness"]
