[package]
name = "game"
default-run = "game"
version = "0.1.0"
edition = "2024"
# One test binary (`tests/main.rs`); every extra target links all of Bevy again.
autotests = false

[features]
# Opt in for faster linking while iterating; normal builds favor runtime performance.
dev_dynamic_linking = ["bevy/dynamic_linking"]
# Builds `examples/chunk_render`, which links all of Bevy again. Off by default
# so `cargo test` does not pay for it.
render_harness = []

# Game code is unoptimized with full debug info, so a debugger shows every
# local and a one-line edit rebuilds in about 2 s. `test` inherits this profile
# unchanged, so `cargo run` and `cargo test` share one set of artifacts.
[profile.dev]
opt-level = 0
debug = true

# Dependencies are optimized, or Bevy is unplayably slow, and keep only line
# tables: full debug info for Bevy makes every link slower and much larger.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# Release favors runtime performance over build time: whole-program LTO in a
# single codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
# Only what the game uses. Bevy's defaults also start audio, gamepads, glTF,
# animation, scenes, sprites, and the post-processing and anti-aliasing
# pipelines, which cost link time and memory for nothing here. Add `audio`
# back when sound is implemented.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "sysinfo_plugin",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_render",
    "bevy_core_pipeline",
    # PBR provides mesh batching/drawing and transitively enables bevy_light.
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "ui_picking",
    "png",
] }
flate2 = "1.1"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Only to lower the priority of the chunk worker threads (`src/main.rs`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Tests live under `tests/`, never in `src/`, so skip the empty unit-test and
# doctest harnesses; each one would be another Bevy link.
[lib]
test = false
doctest = false

[[bin]]
name = "game"
path = "src/main.rs"
test = false

# The dedicated server: the same library with no window or renderer started.
[[bin]]
name = "server"
path = "src/bin/server.rs"
test = false

[[test]]
name = "game"
path = "tests/main.rs"

[[example]]
name = "chunk_render"
required-features = ["render_harness"]
