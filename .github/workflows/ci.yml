name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (Bevy / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Pedantic (and much of clippy::all) is still warn-only locally; gate CI on
      # the high-signal groups until the tree is cleaned up.
      - name: clippy
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System deps (Bevy / winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: test
        run: cargo test

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action runs in Docker; feed it the channel from rust-toolchain.toml
      # so the pin is not duplicated in this workflow.
      - name: Read toolchain channel
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: ${{ steps.toolchain.outputs.channel }}
