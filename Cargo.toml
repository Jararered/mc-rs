[package]
name = "game"
version = "0.1.0"
edition = "2024"

[features]
# Opt in for faster linking while iterating; normal builds favor runtime performance.
dev_dynamic_linking = ["bevy/dynamic_linking"]
# Builds `examples/chunk_render`, which links all of Bevy again. Off by default
# so `cargo test` does not pay for it.
render_harness = []

# Optimize game code enough for representative local play sessions.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Every test target is a separate binary that statically links all of Bevy.
# Full debug info makes each of those links emit a ~1 GB PDB and needs several
# GB of linker memory, so `cargo test` runs out of RAM long before it runs out
# of CPU. Line tables are enough to keep panic backtraces pointing at file and
# line. `cargo run` still builds with the full dev profile.
[profile.test]
debug = "line-tables-only"

[dependencies]
# Only what the game uses. Bevy's defaults also start audio, gamepads, glTF,
# animation, scenes, sprites, and the post-processing and anti-aliasing
# pipelines, which cost link time and memory for nothing here. Add `audio`
# back when sound is implemented.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "sysinfo_plugin",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_light",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "ui_picking",
    "png",
    "ktx2",
    "zstd_rust",
    "tonemapping_luts",
] }
flate2 = "1.1"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[example]]
name = "chunk_render"
required-features = ["render_harness"]

[[bench]]
name = "entities"
harness = false
